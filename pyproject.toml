[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentbudget"
version = "0.1.0"
description = "Stop your agent before it loops forever and burns your budget. Hard limits plus loop detection for agentic workflows, with a benchmark showing what loop detection catches that step limits miss."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ahmed Doghri" }]
keywords = ["llm", "agents", "guardrails", "cost-control", "loop-detection", "ai-safety", "ai"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/ahmeddoghri/agentbudget"

[tool.hatch.build.targets.wheel]
packages = ["agentbudget"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E9", "F", "I"]
